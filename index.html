<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Simple</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Project Simple</h1>
  <p class="tagline">Paste a confusing assignment prompt, rubric, or set of instructions. Get back what it's actually asking for.</p>

  <textarea id="source" placeholder="Paste here…"></textarea>

  <div class="actions">
    <button id="go" type="button">Break it down</button>
    <button id="reset" type="button" hidden>Start over</button>
  </div>

  <div class="state" id="loading" hidden>Formulating…</div>
  <div class="state" id="error" hidden></div>
  <div class="state" id="results" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
